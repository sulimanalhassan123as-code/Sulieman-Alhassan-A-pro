<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEVER HIDE AI PRO</title>

  <!-- Fonts and Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <link rel="icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>

<body>
  <div class="background-animation"></div>

  <div class="container">
    <header>
      <h1>NEVER HIDE AI PRO 🌟</h1>
    </header>

    <div class="chat-container">
      <div id="chat-box" class="chat-box">
        <!-- Chat messages will be added here by JavaScript -->
      </div>

      <!-- CRITICAL FIX: Added the missing "thinking-indicator" element -->
      <div id="thinking-indicator" class="thinking-indicator" style="display: none;">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
      </div>

      <!-- UPGRADE: Moved the input form inside the chat container for better layout -->
      <div class="user-input-container">
        <input type="text" id="user-input" placeholder="Ask NEVER HIDE AI PRO anything..." autocomplete="off" autofocus>
        <button id="send-btn">Send</button>
      </div>
    </div>

    <footer>
      <p>Contact Support:
        <a href="https://wa.me/233599931348" target="_blank">
          WhatsApp (+233 59 993 1348)
        </a>
      </p>

      <button id="install-btn" class="install-button">
        📱 Install NEVER HIDE AI PRO
      </button>
    </footer>
  </div>

  <script src="script.js"></script>

  <!-- PWA Service Worker & Install Prompt Script (No changes needed here) -->
  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('✅ Service Worker registered'))
          .catch(err => console.error('❌ Service Worker registration failed:', err));
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response: ${outcome}`);
        deferredPrompt = null;
      }
    });
  </script>
</body>
  </html>
